<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KC Communication Regression</title><meta name="theme-color" content="#741521"><style>:root{--b:#7a1420;--g:#bd8d33;--ok:#246746;--warn:#8a5b12;--err:#8d2929;--line:#e4ddd4}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f0ea;color:#282626}.shell{min-height:100vh;padding:20px}.card{max-width:760px;margin:0 auto 14px;background:#fff;border-radius:24px;padding:22px;box-shadow:0 18px 60px #59493618}.hat{width:min(170px,42vw);height:125px;margin:auto;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http://www.w3.org/2000/svg%22%20viewBox%3D%220%200%201448%201086%22%3E%3Cg%20fill%3D%22%23000%22%3E%3Cpath%20d%3D%22M%20399%20765%20L%20376%20951%20L%20403%20994%20L%20460%201023%20L%20542%201037%20L%20650%201038%20L%20774%201026%20L%20892%201002%20L%20730%201017%20L%20560%201008%20L%20523%20992%20L%20506%20965%20L%20521%20934%20L%20550%20923%20L%20592%20924%20L%20727%20955%20L%20834%20970%20L%20948%20971%20L%201029%20960%20L%20898%20942%20L%20579%20856%20L%20485%20852%20L%20425%20868%20Z%22/%3E%3Cpath%20d%3D%22M%2097%20287%20L%2057%20484%20L%20169%20655%20L%20377%20705%20L%20444%20628%20L%20705%20588%20L%20861%20622%20L%20975%20690%20L%20987%20844%20L%20769%20783%20L%20542%20774%20L%20851%20833%20L%201037%20944%20L%201037%20683%20L%201171%20696%20L%201276%20664%20L%201355%20580%20L%201393%20467%20L%201379%20361%20L%201317%20281%20L%201194%20236%20L%201076%20263%20L%201001%20120%20L%20825%2033%20L%20685%2051%20L%20480%20183%20L%20287%20253%20L%20489%20224%20L%20754%20116%20L%20896%20126%20L%201021%20243%20L%201006%20377%20L%201160%20279%20L%201246%20289%20L%201316%20342%20L%201345%20468%20L%201262%20602%20L%201147%20646%20L%20976%20599%20L%201048%20475%20L%20940%20574%20L%20846%20573%20L%20910%20476%20L%20903%20347%20L%20869%20479%20L%20790%20550%20L%20724%20560%20L%20728%20449%20L%20714%20514%20L%20663%20558%20L%20454%20565%20L%20293%20422%20L%20322%20515%20L%20392%20591%20L%20307%20638%20L%20186%20601%20L%2097%20462%20L%20135%20303%20L%20201%20244%20L%20465%20160%20L%20558%2089%20L%20192%20206%20Z%22/%3E%3C/g%3E%3C/svg%3E") center/contain no-repeat}.since{display:flex;align-items:center;justify-content:center;gap:10px;font:700 14px Georgia;color:#111}.since:before,.since:after{content:"";width:72px;height:2px;background:#111}.club{text-align:center;font:700 34px Georgia;color:var(--b);margin:8px 0 2px}.sub{text-align:center;color:var(--g);margin-bottom:16px}h1{font-size:26px;color:var(--b);text-align:center}label{font-weight:700;display:block;margin:10px 0 5px}input{width:100%;min-height:50px;border:1px solid #cfc7bd;border-radius:12px;padding:10px;font-size:17px}.btn{width:100%;min-height:52px;border:0;border-radius:13px;padding:10px;margin:8px 0;font-weight:800;font-size:16px;cursor:pointer}.primary{background:var(--b);color:#fff}.secondary{background:#333;color:#fff}.gold{background:#d8b66d;color:#30230b}.note{border:1px solid var(--line);border-radius:13px;padding:12px;margin:10px 0}.ok{background:#edf8f1;color:var(--ok)}.warn{background:#fff5e6;color:var(--warn)}.err{background:#fff0f0;color:var(--err)}.hidden{display:none}.test{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:11px 0}.dot{width:18px;height:18px;border-radius:50%;background:#bbb}.dot.ok{background:#2e9d51}.dot.err{background:#c9362b}.dot.run{background:#d9a400}.small{font-size:12px;color:#777}.result{font-family:ui-monospace,monospace;font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto}.summary{font-size:20px;font-weight:800;text-align:center}.foot{text-align:center;color:#777;font-size:12px;margin-top:14px}</style></head><body><div class="shell"><section class="card"><div class="hat"></div><div class="since">since 1991</div><div class="club">Köcheclub Werne</div><div class="sub">KC Communication · Regression Schritte 3–8</div><div id="login"><h1>Anmeldung</h1><label>E-Mail-Adresse</label><input id="email" type="email" autocomplete="username"><label>Passwort</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="btn primary">Anmelden</button><div id="loginMsg" class="note warn">Bitte anmelden. Es werden zunächst keine Daten verändert und keine Nachrichten versendet.</div></div><div id="suite" class="hidden"><h1>Regressionstest</h1><div id="summary" class="note warn summary">Noch nicht gestartet</div><div id="tests"></div><button id="runBtn" class="btn primary">Alle Prüfungen starten</button><button id="pushBtn" class="btn gold">Optional: Router V4 Push-Fallback real testen</button><button id="logoutBtn" class="btn secondary">Abmelden</button><div id="detail" class="note result">–</div></div><div class="foot">Nur temporäre Testlabor-Seite · Produktivversand bleibt gesperrt</div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://ptblnpiroqftcvlsrhac.supabase.co',K='sb_publishable_SqXIeGN-clcZ4gjmpLdSww_4DLfyy24';const sb=supabase.createClient(U,K,{auth:{persistSession:true}}),$=id=>document.getElementById(id);let session=null;const defs=[['directory','Directory / Empfänger / Neon'],['rules','Programme & Regeln'],['devices','Push-Geräte'],['operations','Testcenter / Protokolle'],['health','KC Communication Health'],['providers','Provider Health'],['gate','Fachprogramm-Sperre DP2']];function draw(){ $('tests').innerHTML=defs.map(([id,n])=>`<div class="test"><span id="d-${id}" class="dot"></span><div><b>${n}</b><div id="m-${id}" class="small">wartet</div></div><span id="s-${id}">–</span></div>`).join('')}function mark(id,ok,msg){$('d-'+id).className='dot '+(ok?'ok':'err');$('m-'+id).textContent=msg;$('s-'+id).textContent=ok?'OK':'FEHLER'}function running(id){$('d-'+id).className='dot run';$('m-'+id).textContent='Prüfung läuft …';$('s-'+id).textContent='…'}async function invoke(name,body={}){const {data,error}=await sb.functions.invoke(name,{body});if(error)throw error;return data}async function ensure(){session=(await sb.auth.getSession()).data.session;if(session){$('login').classList.add('hidden');$('suite').classList.remove('hidden');draw();return true}return false}async function testGate(){const token=(await sb.auth.getSession()).data.session?.access_token;const r=await fetch(U+'/functions/v1/kc-communication-router',{method:'POST',headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+token},body:JSON.stringify({sourceProgram:'kc-dp2',eventKey:'regression_no_send',recipients:[{personId:'KC-P-002'}],testOnly:true,correlationId:'regression-gate-'+Date.now()})});const j=await r.json().catch(()=>({}));return {ok:r.status===423&&j.code==='SOURCE_PROGRAM_NOT_ENABLED',status:r.status,body:j}}async function run(){const detail={};let passed=0;for(const [id] of defs)running(id);try{const d=await invoke('kc-communication-directory',{});detail.directory=d;const ok=d?.ok&&d?.settings?.zero_cost_only===true&&d?.settings?.dispatch_enabled===false&&d?.mirror?.ok===true;mark('directory',ok,ok?`${d.people?.length||0} Person(en), Mirror synchron, 0-€ aktiv`:'Directory/Regeln prüfen');if(ok)passed++}catch(e){mark('directory',false,e.message);detail.directoryError=e.message}try{const r=await invoke('kc-communication-rules-admin',{action:'list'});detail.rules=r;const fach=(r.programs||[]).filter(p=>p.id!=='kc-communication-system'),ok=r?.ok&&fach.every(p=>p.status!=='active'&&p.permissions?.canSend!==true);mark('rules',ok,ok?`${fach.length} Fachprogramme weiterhin gesperrt`:'Mindestens ein Fachprogramm unerwartet freigegeben');if(ok)passed++}catch(e){mark('rules',false,e.message);detail.rulesError=e.message}try{const d=await invoke('kc-communication-push-devices',{action:'list'});detail.devices={ok:d?.ok,count:d?.devices?.length||0};const ok=d?.ok===true;mark('devices',ok,ok?`${d.devices?.length||0} Gerät(e) lesbar`:'Geräte-API fehlerhaft');if(ok)passed++}catch(e){mark('devices',false,e.message);detail.devicesError=e.message}try{const o=await invoke('kc-communication-operations',{action:'status'});detail.operations=o;const ok=o?.ok&&o?.settings?.dispatch_enabled===false&&o?.mirror?.ok===true;mark('operations',ok,ok?`Requests ${o.counts?.requests||0}, Events ${o.counts?.events||0}, Mirror OK`:'Betriebsstatus prüfen');if(ok)passed++}catch(e){mark('operations',false,e.message);detail.operationsError=e.message}try{const h=await invoke('kc-communication-health',{});detail.health=h;const ok=h?.ok!==false;mark('health',ok,ok?'Health-Endpunkt antwortet':'Health meldet Fehler');if(ok)passed++}catch(e){mark('health',false,e.message);detail.healthError=e.message}try{const p=await invoke('kc-communication-provider-health',{});detail.providers=p;const ok=p?.ok!==false;mark('providers',ok,ok?'Provider-Status abrufbar':'Provider Health meldet Fehler');if(ok)passed++}catch(e){mark('providers',false,e.message);detail.providerError=e.message}try{const g=await testGate();detail.gate=g;mark('gate',g.ok,g.ok?'DP2 korrekt mit 423 blockiert':`Unerwarteter Status ${g.status}`);if(g.ok)passed++}catch(e){mark('gate',false,e.message);detail.gateError=e.message}$('summary').className='note '+(passed===defs.length?'ok':'err')+' summary';$('summary').textContent=`${passed}/${defs.length} Prüfungen bestanden`;$('detail').textContent=JSON.stringify(detail,null,2)}async function pushTest(){if(!confirm('Jetzt genau EINEN Test-Push über Router V4 senden? Produktivversand bleibt weiterhin gesperrt.'))return;const d=await invoke('kc-communication-manual-send',{audience:{type:'all'},mode:'fallback',subject:'KC Communication Router V4 Test',message:'Regression erfolgreich – Router V4 personengenauer Fallback.',priority:'normal',testOnly:true});$('detail').textContent=JSON.stringify(d,null,2);alert(d?.sent?`Test abgeschlossen: ${d.sent}/${d.recipientCount} erfolgreich.`:'Kein Test-Push erfolgreich.')}draw();$('loginBtn').onclick=async()=>{const b=$('loginBtn');b.disabled=true;const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').className='note err';$('loginMsg').textContent='Anmeldung fehlgeschlagen: '+error.message;b.disabled=false;return}await ensure();b.disabled=false};$('runBtn').onclick=run;$('pushBtn').onclick=pushTest;$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};ensure();</script></body></html>
