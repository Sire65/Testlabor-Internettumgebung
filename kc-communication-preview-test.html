<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KC Communication – Vorschau-Test</title><style>body{font-family:Arial,sans-serif;background:#f5f1ea;margin:0;color:#222}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 8px 28px #0001}.brand{text-align:center;color:#8f1524}.brand h1{font-family:Georgia,serif;font-size:42px;margin:8px 0}.since{display:flex;align-items:center;gap:12px;justify-content:center;font-weight:700;color:#222}.since:before,.since:after{content:'';height:2px;background:#222;width:120px}.muted{color:#777}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;box-sizing:border-box;padding:14px;border:1px solid #bbb;border-radius:12px;font-size:18px}.btn{width:100%;border:0;border-radius:14px;padding:16px;font-size:19px;font-weight:700;background:#97182a;color:white;margin-top:14px}.preview{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{border:1px solid #ddd;border-radius:16px;padding:16px;background:#fafafa;white-space:pre-wrap}.ok{background:#eaf7ee;border:1px solid #b8dec2;color:#236b3b;padding:14px;border-radius:14px}.err{background:#fff0f0;border:1px solid #efc4c4;color:#9a2a2a;padding:14px;border-radius:14px}.login input{width:100%;box-sizing:border-box;margin:8px 0;padding:14px;border:1px solid #bbb;border-radius:12px;font-size:18px}@media(max-width:650px){.row,.preview{grid-template-columns:1fr}.brand h1{font-size:34px}.since:before,.since:after{width:70px}}</style></head><body><div class="wrap"><div class="card"><div class="brand"><h1>Köcheclub Werne</h1><div class="since">since 1991</div><p>KC Communication · Vorschau-Test</p></div><div id="login" class="login"><h2>Anmelden</h2><input id="email" type="email" placeholder="E-Mail"><input id="password" type="password" placeholder="Passwort"><button class="btn" id="loginBtn">Anmelden</button><div id="loginMsg"></div></div><div id="app" style="display:none"><div class="ok">Vorschau-Modus: Es wird keine Nachricht verschickt.</div><div class="field"><label>Ereignis</label><select id="event"><option value="shift_changed">Dienst geändert</option><option value="replacement_requested">Vertretung gesucht</option><option value="plan_released">Plan freigegeben</option></select></div><div id="fields"></div><button class="btn" id="previewBtn">Vorschau erzeugen</button><div id="status"></div><div class="preview"><div class="box"><h3>Push-Vorschau</h3><strong id="pushTitle">–</strong><div id="pushBody" style="margin-top:8px">–</div></div><div class="box"><h3>E-Mail-Vorschau</h3><strong id="mailSubject">–</strong><div id="mailText" style="margin-top:8px">–</div></div></div><div class="box" style="margin-top:14px"><strong>Sicherheitsstatus</strong><div id="guard">–</div></div><button class="btn" id="logout" style="background:#333">Abmelden</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://ptblnpiroqftcvlsrhac.supabase.co',K='sb_publishable_SqXIeGN-clcZ4gjmpLdSww_4DLfyy24',sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id);const defs={shift_changed:[['date','Datum','05.12.2026'],['from','Von','14:00'],['to','Bis','18:00'],['name','Name','Testperson']],replacement_requested:[['date','Datum','06.12.2026'],['from','Von','16:00'],['to','Bis','20:00'],['name','Name','Testperson']],plan_released:[['periodLabel','Zeitraum','Weihnachtsmarkt 2026'],['name','Name','Testperson']]};const normalizeBreaks=v=>String(v??'').replace(/\\r\\n/g,'\n').replace(/\\n/g,'\n').replace(/\\r/g,'\n');function renderFields(){const e=$('event').value;$('fields').innerHTML='<div class="row">'+defs[e].map(([k,l,v])=>`<div class="field"><label>${l}</label><input data-k="${k}" value="${v}"></div>`).join('')+'</div>'}async function show(){const {data}=await sb.auth.getSession();$('login').style.display=data.session?'none':'block';$('app').style.display=data.session?'block':'none';if(data.session){renderFields();await preview()}}$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginMsg').innerHTML=error?'<div class="err">Anmeldung fehlgeschlagen.</div>':'';if(!error)show()};$('logout').onclick=async()=>{await sb.auth.signOut();show()};$('event').onchange=()=>{renderFields();preview()};$('previewBtn').onclick=preview;async function preview(){const {data:s}=await sb.auth.getSession();if(!s.session)return;const eventKey=$('event').value,vars={recipient:{displayName:'Testperson'}};document.querySelectorAll('[data-k]').forEach(i=>{if(i.dataset.k==='name')vars.recipient.displayName=i.value;else vars[i.dataset.k]=i.value});$('status').innerHTML='<p class="muted">Vorschau wird geladen…</p>';try{const r=await fetch(U+'/functions/v1/kc-communication-preview',{method:'POST',headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+s.session.access_token,'x-client-info':'kc-preview-test/1.1'},body:JSON.stringify({sourceProgram:'kc-dp2',eventKey,variables:vars})});const d=await r.json();if(!r.ok)throw new Error(d.error||('HTTP '+r.status));$('pushTitle').textContent=normalizeBreaks(d.rendered?.push?.title||'–');$('pushBody').textContent=normalizeBreaks(d.rendered?.push?.body||'–');$('mailSubject').textContent=normalizeBreaks(d.rendered?.email?.subject||'–');$('mailText').textContent=normalizeBreaks(d.rendered?.email?.text||'–');$('guard').textContent=`DP2: ${d.program?.status}; canSend=${d.program?.canSend}; Regel aktiv=${d.rule?.enabled}; previewOnly=${d.previewOnly}; messageSent=${d.messageSent}`;$('status').innerHTML='<div class="ok">Vorschau erfolgreich gerendert.</div>'}catch(e){$('status').innerHTML='<div class="err">'+String(e.message||e)+'</div>'}}show();</script></body></html>
