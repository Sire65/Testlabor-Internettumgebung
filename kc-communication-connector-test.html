<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KC Communication Connector-Test</title><style>body{font-family:Arial,sans-serif;background:#f4f0ea;margin:0;padding:20px;color:#282626}.card{max-width:720px;margin:auto;background:#fff;border-radius:22px;padding:22px}.btn{width:100%;min-height:50px;border:0;border-radius:12px;margin:8px 0;font-weight:700;font-size:16px}.red{background:#7a1420;color:white}.dark{background:#333;color:white}.box{padding:12px;border-radius:12px;margin:10px 0;background:#f6f6f6;white-space:pre-wrap}.ok{background:#edf8f1;color:#246746}.err{background:#fff0f0;color:#8d2929}input{width:100%;min-height:48px;margin:5px 0 10px;padding:10px;border:1px solid #ccc;border-radius:10px;font-size:16px}h1{color:#7a1420}</style></head><body><div class="card"><h1>KC Communication – Connector-Test</h1><p>Isolierter Test des gemeinsamen Clients. DP2 selbst wird nicht verändert.</p><div id="login"><input id="email" type="email" placeholder="E-Mail"><input id="password" type="password" placeholder="Passwort"><button id="loginBtn" class="btn red">Anmelden</button></div><div id="app" hidden><button id="testBtn" class="btn red">Connector komplett prüfen</button><button id="logoutBtn" class="btn dark">Abmelden</button><div id="out" class="box">Noch nicht gestartet.</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://ptblnpiroqftcvlsrhac.supabase.co',K='sb_publishable_SqXIeGN-clcZ4gjmpLdSww_4DLfyy24';const sb=supabase.createClient(U,K,{auth:{persistSession:true}});</script><script>
(function(global){'use strict';const DEFAULT_URL='https://ptblnpiroqftcvlsrhac.supabase.co',DEFAULT_PUBLISHABLE_KEY='sb_publishable_SqXIeGN-clcZ4gjmpLdSww_4DLfyy24';class KCCommunicationError extends Error{constructor(message,code,status,details){super(message);this.name='KCCommunicationError';this.code=code||'KC_COMMUNICATION_ERROR';this.status=status||0;this.details=details||null}}class KCCommunicationClient{constructor(options={}){this.baseUrl=(options.baseUrl||DEFAULT_URL).replace(/\/$/,'');this.publishableKey=options.publishableKey||DEFAULT_PUBLISHABLE_KEY;this.sourceProgram=String(options.sourceProgram||'').trim();this.getAccessToken=typeof options.getAccessToken==='function'?options.getAccessToken:async()=>null;this.defaultTestOnly=options.defaultTestOnly!==false;this.timeoutMs=Math.max(2000,Number(options.timeoutMs)||12000);if(!this.sourceProgram)throw new KCCommunicationError('sourceProgram fehlt','SOURCE_PROGRAM_REQUIRED')}async _request(functionName,body={},method='POST'){const token=await this.getAccessToken();if(!token)throw new KCCommunicationError('Keine aktive KC-Anmeldung','AUTH_REQUIRED',401);const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),this.timeoutMs);let response;try{response=await fetch(`${this.baseUrl}/functions/v1/${functionName}`,{method,headers:{'Content-Type':'application/json','apikey':this.publishableKey,'Authorization':`Bearer ${token}`,'x-client-info':'kc-communication-client/0.1.0'},body:method==='GET'?undefined:JSON.stringify(body||{}),signal:ctl.signal})}catch(e){clearTimeout(timer);if(e&&e.name==='AbortError')throw new KCCommunicationError('KC Communication Zeitüberschreitung','TIMEOUT',0);throw new KCCommunicationError('KC Communication nicht erreichbar','NETWORK_ERROR',0,{cause:String(e?.message||e)})}clearTimeout(timer);const data=await response.json().catch(()=>({}));if(!response.ok)throw new KCCommunicationError(data?.error||`HTTP ${response.status}`,data?.code||'HTTP_ERROR',response.status,data);return data}async health(){return this._request('kc-communication-health',{},'POST')}async checkAccess(){const data=await this._request('kc-communication-rules-admin',{action:'list'});const program=(data?.programs||[]).find(p=>p.id===this.sourceProgram)||null;return{ok:!!program,sourceProgram:this.sourceProgram,program,canSend:program?.status==='active'&&program?.permissions?.canSend===true,status:program?.status||'unknown'}}async emitEvent(eventKey,{recipients=[],variables={},priority='normal',testOnly=this.defaultTestOnly,correlationId=null,orgId=null}={}){const payload={sourceProgram:this.sourceProgram,eventKey:String(eventKey),recipients:Array.isArray(recipients)?recipients:[],variables:variables&&typeof variables==='object'?variables:{},priority,testOnly:testOnly===true,correlationId:correlationId||`${this.sourceProgram}-${eventKey}-${crypto.randomUUID()}`};if(orgId)payload.orgId=String(orgId);return this._request('kc-communication-router',payload,'POST')}}global.KCCommunicationClient=KCCommunicationClient;global.KCCommunicationError=KCCommunicationError})(window);
</script><script>const out=document.getElementById('out'),app=document.getElementById('app'),login=document.getElementById('login');async function token(){return (await sb.auth.getSession()).data.session?.access_token||null}const client=new KCCommunicationClient({sourceProgram:'kc-dp2',getAccessToken:token,defaultTestOnly:true});async function show(){const s=(await sb.auth.getSession()).data.session;login.hidden=!!s;app.hidden=!s}document.getElementById('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){out.className='box err';out.textContent=error.message}else await show()};document.getElementById('logoutBtn').onclick=async()=>{await sb.auth.signOut();await show()};document.getElementById('testBtn').onclick=async()=>{const r={};try{r.health=await client.health()}catch(e){r.healthError={message:e.message,code:e.code,status:e.status}}try{r.access=await client.checkAccess()}catch(e){r.accessError={message:e.message,code:e.code,status:e.status}}try{r.emit=await client.emitEvent('connector_probe',{recipients:[{personId:'KC-P-002'}],variables:{probe:true},testOnly:true})}catch(e){r.emitBlocked={message:e.message,code:e.code,status:e.status,details:e.details}}const ok=r.health?.ok===true&&r.access?.canSend===false&&r.emitBlocked?.status===423&&r.emitBlocked?.code==='SOURCE_PROGRAM_NOT_ENABLED';out.className='box '+(ok?'ok':'err');out.textContent=(ok?'3/3 bestanden\n\n':'Prüfung nicht vollständig bestanden\n\n')+JSON.stringify(r,null,2)};show();</script></body></html>
